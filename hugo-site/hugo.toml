baseURL = 'https://d1zo83ah1w5tci.cloudfront.net/'
languageCode = 'ja'
title = 'AWS + Hugo テックブログ'
theme = 'Paper'

[params]
  # サイト情報
  description = "AWSとHugoを使った静的サイトのテックブログです"
  keywords = ["AWS", "Hugo", "Terraform", "CloudFront", "S3", "テックブログ"]
  author = "Developer"

  # Paper テーマ固有の設定
  color = "linen"  # linen, wheat, gray, light, dark
  twitter = ""
  github = "kazukifukuyama14/techblog-staging"
  instagram = ""
  rss = true

  # 日付フォーマット
  dateFormat = "2006年1月2日"

  # アバター設定（オプション）
  # avatar = "/images/avatar.png"
  # name = "Developer"
  # bio = "AWSとHugoを使った技術ブログを運営しています"



# メニュー設定
[menu]
  [[menu.main]]
    identifier = "home"
    name = "ホーム"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "記事"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    identifier = "categories"
    name = "カテゴリ"
    url = "/categories/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
