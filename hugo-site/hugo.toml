# baseURL = 'https://d1zo83ah1w5tci.cloudfront.net/'  # ← リポジトリから削除/コメントアウト
baseURL = "/"                                         # ローカル/プレビュー用（必要に応じて）
languageCode = 'ja'
title = 'AWS + Hugo テックブログ'
theme = 'Paper'

[params]
  # サイト情報
  description = "AWSとHugoを使った静的サイトのテックブログです"
  keywords = ["AWS", "Hugo", "Terraform", "CloudFront", "S3", "テックブログ"]
  author = "Developer"

  # Paper テーマ固有の設定
  color = "linen"  # linen, wheat, gray, light, dark
  rss = true

  # 日付フォーマット
  dateFormat = "2006年1月2日"

  # アバター設定（オプション）
  # avatar = "/images/avatar.png"
  # name = "Developer"
  # bio = "AWSとHugoを使った技術ブログを運営しています"



# メニュー設定
[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "info"
    name = "Info"
    url = "/info/"
    weight = 20

# マークアップ設定
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "github"
