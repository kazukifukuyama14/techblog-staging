name: Deploy Hugo Site to S3 and CloudFront

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  HUGO_VERSION: 0.149.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        working-directory: ./hugo-site
        if: github.ref == 'refs/heads/main'
        run: hugo --minify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        if: github.ref == 'refs/heads/main'
        working-directory: ./hugo-site
        run: |
          if [ -d public ]; then
          aws s3 sync public/ s3://techblog-staging-staging-bucket-sdq41kwy --delete --cache-control max-age=86400
          else
            echo "public ディレクトリが存在しません。ビルドに失敗している可能性があります。"
            exit 0
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1FIQFTIZP611J \
            --paths "/*"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Site URL: https://d1zo83ah1w5tci.cloudfront.net"
          echo "📊 CloudFront Distribution: E1FIQFTIZP611J"
          echo "🪣 S3 Bucket: techblog-staging-staging-bucket-sdq41kwy"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
          echo "Please check the logs above for details."
